name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # RPi.GPIO and spidev (in requirements.txt) are Pi-only; install just the
      # platform-independent deps the tests need.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Type check (mypy)
        run: python -m mypy airQuality.py

      - name: Run tests
        run: python -m pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint deploy.sh (shellcheck)
        run: shellcheck deploy.sh

      - name: Verify rendered systemd unit
        run: |
          # systemd-analyze validates ExecStart= paths exist, so substitute
          # the template placeholders with values that point at real things
          # on the runner before verifying.
          mkdir -p /tmp/test-repo /tmp/test-state
          cp airQuality.py /tmp/test-repo/airQuality.py
          sed \
            -e 's|@USER@|root|g' \
            -e 's|@GROUP@|root|g' \
            -e 's|@REPO_DIR@|/tmp/test-repo|g' \
            -e 's|@PYTHON@|/usr/bin/python3|g' \
            -e 's|@STATE_DIR@|/tmp/test-state|g' \
            systemd/airquality.service.in > /tmp/airquality.service
          systemd-analyze verify /tmp/airquality.service

      - name: Verify timer
        run: systemd-analyze verify systemd/airquality.timer
