[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["waveshare_epd"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true

# The vendored Waveshare driver is read-only (see CLAUDE.md) and is not type
# annotated — silence its diagnostics without weakening checks on our code.
[[tool.mypy.overrides]]
module = "waveshare_epd.*"
follow_imports = "silent"
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-v --cov=airQuality --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
